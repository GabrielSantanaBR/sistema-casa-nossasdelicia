<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><meta name="theme-color" content="#111b2c"/><title>Finanças | Casa & Nossas Delícias</title><link rel="stylesheet" href="/style.css"/></head>
<body><div id="login" class="login-shell"><form id="login-form" class="login-panel"><span class="eyebrow">GESTÃO FINANCEIRA PRIVADA</span><div class="brand-mark">◇</div><h1>Seu dinheiro,<br>com clareza.</h1><p>Um lugar para cuidar das finanças da casa e da Nossas Delícias, sem misturar os números.</p><label>E-mail<input type="email" name="email" autocomplete="username" required placeholder="Seu e-mail"/></label><label>Senha<input type="password" name="password" autocomplete="current-password" required placeholder="Sua senha"/></label><button class="primary" type="submit">Entrar no sistema <span>↗</span></button><small id="login-error" role="alert"></small></form></div>
<div id="app" class="shell hidden">
<aside class="sidebar"><div class="identity"><span class="brand-mark small">◇</span><span>ORBITA <small>finanças</small></span></div><span class="side-label">AMBIENTE</span><div id="spaces" class="spaces"></div><span class="side-label">NAVEGAÇÃO</span><nav id="nav"><button data-view="overview" class="active">◫ <span>Visão geral</span></button><button data-view="entries">⇄ <span>Lançamentos</span></button><button data-view="bills">▤ <span>Contas a pagar/receber</span></button><button data-view="cards">▣ <span>Cartões</span></button><button data-view="accounts">◈ <span>Contas e caixas</span></button><button data-view="categories">▦ <span>Categorias</span></button><button data-view="contacts">♧ <span>Contatos</span></button><button data-view="reports">▥ <span>Prestação de contas</span></button><button data-view="audit">◷ <span>Histórico de ações</span></button></nav><div class="side-footer"><span id="account-email"></span><button id="logout">Sair ↗</button></div></aside>
<div class="main"><header class="topbar"><div><span class="eyebrow" id="context">PAINEL FINANCEIRO</span><h2 id="heading">Visão geral</h2></div><div class="top-actions"><span id="today"></span><button id="theme" title="Alternar tema">◐</button><button id="add" class="primary">+ Novo lançamento</button></div></header><main id="content"></main></div></div>
<dialog id="dialog"><form id="form"><header class="modal-header"><div><span class="eyebrow" id="modal-subtitle">CADASTRO</span><h2 id="modal-title">Novo lançamento</h2></div><button type="button" id="close-dialog" class="icon-button" aria-label="Fechar">✕</button></header><div id="form-fields" class="form-grid"></div><p id="form-error" class="error"></p><footer class="modal-footer"><button type="button" id="cancel">Cancelar</button><button class="primary" type="submit">Salvar alterações</button></footer></form></dialog>
<div id="toast" class="toast hidden" role="status"></div><script type="module" src="/app.js"></script></body></html>
